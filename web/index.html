<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0A0E13" />
  <title>FINN</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="top">
    <button class="icon-btn" id="backBtn" hidden aria-label="Back">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <div class="brand"><span class="logo">F</span><div><div class="name" id="hTitle">FINN</div><div class="sub" id="hSub"></div></div></div>
    <button class="icon-btn" id="refreshBtn" aria-label="Refresh">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
    </button>
  </header>

  <div id="ptr"><span>↻</span></div>
  <div id="toast" hidden></div>
  <main id="view"></main>
  <div id="sheetHost"></div>
  <button id="fab" aria-label="Ask FINN"><span>✦</span> Ask FINN</button>
  <div id="agentHost"></div>

  <nav class="tabs">
    <button class="tab active" data-tab="today">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      <span>Today</span>
    </button>
    <button class="tab" data-tab="research">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <span>Research</span>
    </button>
    <button class="tab" data-tab="portfolio">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      <span>Portfolio</span>
    </button>
  </nav>

  <script src="js/sample1.js"></script>
  <script src="js/config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/analysis.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/search.js"></script>
  <script src="js/glossary.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
